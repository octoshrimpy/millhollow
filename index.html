<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<script src="js/ds/themes.js"></script>
<title>Millhollow</title>
<style>
  :root {
    --bg: #14110e; --ink: #d9cbb4; --dim: #8a7c68; --line: #2e2721;
    --accent: #c08a4e; --card: #1d1814; --good: #8fb573; --bad: #c9655a; --story: #b9a4d6;
    --on-accent: #1a120a; --face-filter: saturate(1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.5 Georgia, 'Iowan Old Style', serif;
  }
  button, select {
    font: inherit; font-size: .95rem; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: .45em .8em; cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
  button.on { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: bold; }
  button.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
  button.wide { width: 100%; margin-top: .6em; }
  small { font-size: .8em; }
  .dim { color: var(--dim); } .good { color: var(--good); } .bad { color: var(--bad); } .story { color: var(--story); }
  .wrap { max-width: 44em; margin: 0 auto; padding: 0 16px; }
  .row { display: flex; gap: .5em; align-items: center; margin: .4em 0; }
  .row.wrap { flex-wrap: wrap; padding: 0; max-width: none; margin-left: 0; }
  .row.between { justify-content: space-between; }
  .grow { flex: 1; min-width: 0; }
  h3, h4 { margin: .6em 0 .3em; }

  header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); z-index: 5; }
  header .topbar { display: flex; align-items: center; gap: .5em; padding-top: env(safe-area-inset-top); }
  #res { flex: 1; display: flex; flex-wrap: wrap; align-items: center; gap: .25em 1em; padding: .55em 0; font-size: .95rem; }
  #res span { display: inline-flex; align-items: center; gap: .3em; }
  #res .day { color: var(--accent); font-weight: bold; }
  .housing { display: inline-flex; align-items: center; gap: .35em; }
  #menu { background: none; border: 0; padding: .4em; color: var(--dim); font-size: 1.15rem; line-height: 1; }
  /* The newest log lines and the tabs ride together at the bottom; main pads by the measured height. */
  #dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #tabs { display: flex; justify-content: center; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  #tabs button { flex: 1; max-width: 8em; display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: none; border: 0; border-radius: 12px; padding: .45em 0 .35em; color: var(--dim); font-size: 1.35rem; line-height: 1; }
  #tabs button svg.i { vertical-align: 0; }
  #tabs button:not(.on) svg.i { filter: saturate(.35) brightness(.8); }
  #tabs button small { font-size: .62rem; letter-spacing: .02em; }
  #tabs button.on { color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, var(--card)); }
  #tabs button.on small { font-weight: bold; }
  main.wrap { padding-top: .6em; padding-bottom: calc(var(--dock-h, 8em) + 1em); }
  .menu h3 { margin-top: 0; }
  .menu .pair button { flex: 1; }
  .saves { margin: 0 0 .9em; }
  .saves textarea { width: 100%; box-sizing: border-box; resize: none; font: .75rem/1.3 ui-monospace, monospace; word-break: break-all;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: .5em .6em; margin-bottom: .5em; }
  .saves textarea.nope { border-color: var(--bad); animation: nope .35s; }
  @keyframes nope { 25% { transform: translateX(-6px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }

  .grid, .map { display: grid; grid-template-columns: repeat(var(--w), 1fr); gap: 6px; margin: .6em 0; }
  .tile { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 2px; overflow: hidden; }
  .tile small { font-size: .62rem; line-height: 1.1; text-align: center; }
  .tile { position: relative; }
  /* The land pans under a fixed window; tiles keep their size however much is known. */
  .land { position: relative; overflow: auto; max-height: 62vh; margin: .6em 0; overscroll-behavior: contain; scrollbar-width: none; touch-action: pan-x pan-y; }
  .land::-webkit-scrollbar { display: none; }
  .land .grid { --t: min(76px, calc((100vw - 60px) / 5.5)); grid-template-columns: repeat(var(--w), var(--t)); width: max-content; margin: 0 auto; }
  .land.drag { cursor: grabbing; user-select: none; }
  .tile.fog { border-color: transparent; background: radial-gradient(circle, color-mix(in srgb, var(--ink) 5%, transparent), transparent 70%); }
  .tile.hall { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .tile.found { border-color: var(--accent); border-style: solid; color: var(--accent); font-size: 1.4rem; animation: found 1.6s ease-in-out infinite; }
  @keyframes found { 50% { box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 45%, transparent); } }
  .tile.fresh { animation: reveal .45s calc(var(--d, 0) * 90ms) both; }
  button.ghost { background: transparent; border-color: transparent; color: var(--dim); }
  .tools { align-items: center; gap: .4em; margin: .7em 0; }
  .tile .mini { position: absolute; top: 3px; right: 3px; width: 34%; height: auto; aspect-ratio: 1; border-radius: 5px;
    box-shadow: 0 0 0 1.5px var(--card); }
  .tile.empty { color: var(--dim); background: transparent; border-style: dashed; }
  .tile.wild { background: color-mix(in srgb, var(--c-green) 7%, var(--bg)); border-color: color-mix(in srgb, var(--c-green) 16%, var(--bg)); }
  .tile.wild .ico { opacity: .55; }
  .chip.potion { border-color: var(--good); color: var(--ink); }
  .chip.potion:disabled { opacity: .45; }
  .ico { font-size: 1.5rem; line-height: 1; }
  svg.i { width: 1.15em; height: 1.15em; vertical-align: -0.2em; display: inline-block; flex: none; }
  .ico svg.i { width: 1em; height: 1em; vertical-align: middle; }
  .face { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; flex: none; background: var(--line); }
  img.face, img.mini, .who img, .arrival img, .knock img { filter: var(--face-filter); }
  .mini { width: 28px; height: 28px; border-radius: 6px; object-fit: cover; flex: none; }

  .card { display: flex; gap: .8em; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: .7em; margin: .6em 0; }
  .card.event { border-color: var(--story); }
  .knock { display: flex; align-items: center; gap: .6em; width: 100%; margin: .6em 0; border-color: var(--story); text-align: left; }
  .knock b { font-weight: normal; flex: 1; }
  .knock .mini { width: 36px; height: 36px; }
  .arrival { display: flex; flex-direction: column; align-items: center; gap: .35em; text-align: center; }
  .arrival .face { width: 110px; height: 110px; border-radius: 12px; }
  .arrival h3 { margin: .2em 0 0; }
  .arrival .row { justify-content: center; }
  .arrival .chip { font-size: .9rem; }
  .arrival .pair { width: 100%; margin-top: .8em; gap: 8px; }
  .arrival .pair button { flex: 1; padding: .7em; }
  .card.event { display: block; }
  .opt { display: flex; gap: .7em; align-items: center; width: 100%; text-align: left; margin: .35em 0; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 1em; }
  .sheet-head h3 { margin: 0; }
  .desc { font-style: italic; margin: .15em 0 0; }
  button.small { font-size: .8rem; padding: .3em .7em; }
  .who { display: grid; grid-template-columns: repeat(auto-fill, minmax(6.2em, 1fr)); gap: 8px; margin: .8em 0 1.2em; }
  .who button { position: relative; display: flex; flex-direction: column; align-items: center; gap: .15em; padding: .6em .3em .45em; min-width: 0; }
  .who img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; display: block; }
  .who em { z-index: 1; position: absolute; right: 4px; top: 4px; font: bold .85rem Georgia, serif; font-style: normal;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: .15em .45em; }
  .who em.top { color: var(--accent); border-color: var(--accent); }
  .who em i { font-style: normal; margin-right: .3em; }
  .who b { font-weight: normal; margin-top: .25em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who .st { font-size: .75rem; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
  .who .st.free { color: var(--good); }
  .who .st.here { color: var(--accent); }
  .who button.on { background: color-mix(in srgb, var(--accent) 14%, var(--card)); box-shadow: 0 0 0 2px var(--accent) inset; }
  .opt:disabled { opacity: .6; } .opt:disabled .bad { font-weight: bold; }
  .chip { font-size: .78rem; padding: .2em .55em; border-radius: 999px; border: 1px solid var(--line); background: transparent; }
  .person select { font-size: .78rem; padding: .2em .4em; }

  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 3px 0; }
  .bar i { display: block; height: 100%; background: var(--good); transition: width .1s linear; }
  .bar.atb { height: 3px; } .bar.atb i { background: var(--accent); transition: none; }

  .map { max-width: 22em; margin-left: auto; margin-right: auto; }
  .room { aspect-ratio: 1; padding: 0; font-size: 1.3rem; }
  .room.none { visibility: hidden; }
  .room.done { background: color-mix(in srgb, var(--ink) 6%, var(--card)); }
  .room.here { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; opacity: 1; }
  .room:disabled { opacity: .55; }
  .room.here:disabled { opacity: 1; }
  .party { display: flex; gap: .6em; overflow-x: auto; }
  .pc { width: 5.5em; text-align: center; } .pc.dead { opacity: .35; }
  .pc small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #log { padding: .35em 16px 0; font-size: .8rem; }
  #log:not(:empty) { border-bottom: 1px solid var(--line); padding-bottom: .35em; }
  #log p { margin: .15em 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } #log p.day { color: var(--dim); } #log small { color: var(--dim); margin-right: .3em; }

  #sheet, #fight { position: fixed; inset: 0; background: #000a; z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
  #sheet .inner { background: var(--bg); border: 1px solid var(--line); border-radius: 14px 14px 0 0; width: 100%; max-width: 30em; max-height: 85vh; overflow-y: auto; overscroll-behavior: contain; padding: 1.4em 16px 1em; position: relative; transition: transform .22s ease-in; }
  #sheet .inner::before { content: ""; position: absolute; top: 7px; left: 50%; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: var(--line); }
  #sheet { transition: background .22s; }
  #sheet.open .inner { animation: sheet-up .28s cubic-bezier(.2, .8, .2, 1); }
  #sheet.closing { background: #0000 !important; pointer-events: none; }
  #sheet.closing .inner { transform: translateY(100%) !important; }
  @keyframes sheet-up { from { transform: translateY(100%); } }
  #fight { align-items: center; background: #000c; }
  .fightbox { background: var(--bg); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 40em; max-height: 100vh; overflow-y: auto; padding: 1em 16px; }
  .foes { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .foe { width: 6.5em; display: flex; flex-direction: column; align-items: center; padding: .4em; }
  .foe small { font-size: .7rem; }
  .foe .bar { width: 100%; } .foe .bar.hp i { background: var(--bad); }
  .foe.focus { border-color: var(--accent); }
  .foe.dead, .hero.dead { opacity: .25; }
  .foe, .hero { transition: background .3s, transform .08s, border-color .2s; }
  .flash { background: color-mix(in srgb, var(--bad) 40%, var(--card)) !important; transition: none; }
  .healed { box-shadow: 0 0 0 2px var(--good); }
  .heroes { display: grid; grid-template-columns: repeat(auto-fit, minmax(15em, 1fr)); gap: 6px; }
  .hero { display: flex; gap: .6em; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: .5em; }
  .hero .face { width: 52px; height: 52px; }
  .skill { color: var(--accent); }
  .lines { min-height: 5.5em; font-size: .82rem; color: var(--dim); margin: .6em 0; }
  .lines p { margin: .1em 0; }
  .controls { justify-content: center; }

  /* ---------- juice ---------- */
  button { transition: transform .08s, border-color .2s, box-shadow .2s; }
  button:active:not(:disabled) { transform: scale(.95); }
  .tile:not(.empty):hover, .room:not(:disabled):hover { border-color: var(--dim); }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 25; }
  #floats { position: fixed; inset: 0; pointer-events: none; z-index: 26; overflow: hidden; }
  .float { position: absolute; transform: translate(-50%, -50%); font-weight: bold; font-size: 1.05rem; white-space: nowrap;
    color: #fff4d6; text-shadow: 0 2px 0 #000, 0 0 6px #000; animation: rise 1.1s ease-out forwards; }
  .float.hurt { color: #ff8a7a; }
  .float.crit { color: #ffd23a; font-size: 1.6rem; animation-name: critrise; }
  .float.heal { color: #9fe07a; }
  .float.skillname { color: var(--accent); font-style: italic; font-size: .95rem; }
  .float.yield { font-size: .9rem; animation-duration: 1.4s; }
  .float.res { font-size: .75rem; animation-name: sink; }
  .float.res.up { color: var(--good); } .float.res.down { color: var(--bad); }
  .float.banner { font-size: 2.6rem; letter-spacing: .08em; color: #ffe08a; animation: banner 1.6s ease-out forwards; }
  .float.banner.bad { color: var(--bad); }
  @keyframes rise { 0% { opacity: 0; margin-top: 6px; } 15% { opacity: 1; margin-top: -8px; } 100% { opacity: 0; margin-top: -48px; } }
  @keyframes critrise { 0% { opacity: 0; scale: 2.2; } 15% { opacity: 1; scale: 1; } 30% { scale: 1.15; } 100% { opacity: 0; margin-top: -56px; } }
  @keyframes sink { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; margin-top: 22px; } }
  @keyframes banner { 0% { opacity: 0; scale: .4; } 20% { opacity: 1; scale: 1.1; } 30% { scale: 1; } 75% { opacity: 1; } 100% { opacity: 0; scale: 1.05; } }

  #toasts { position: fixed; left: 50%; bottom: calc(var(--dock-h, 80px) + 10px); transform: translateX(-50%); z-index: 30; display: flex; flex-direction: column; gap: 6px;
    align-items: center; pointer-events: none; width: min(26em, calc(100% - 32px)); }
  .toast { background: var(--card); border: 1px solid var(--accent); border-radius: 10px; padding: .45em .9em; font-size: .9rem;
    box-shadow: 0 6px 20px #000a; animation: toast 2.6s ease-out forwards; text-align: center; }
  .toast.good { border-color: var(--good); } .toast.bad { border-color: var(--bad); } .toast.story { border-color: var(--story); }
  @keyframes toast { 0% { opacity: 0; translate: 0 20px; } 10% { opacity: 1; translate: 0 0; } 85% { opacity: 1; } 100% { opacity: 0; translate: 0 -10px; } }

  .veil { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: .3em; pointer-events: none; animation: veil 1.3s ease-in forwards; }
  .veil b { font-size: 2.2rem; color: var(--accent); letter-spacing: .1em; animation: veiltext 1.3s ease-out forwards; }
  .veil small { color: var(--dim); font-style: italic; }
  @keyframes veil { 0%, 45% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes veiltext { 0% { opacity: 0; letter-spacing: .5em; } 30% { opacity: 1; letter-spacing: .1em; } }

  #log p.new { animation: logslide .5s ease-out; }
  #log p.new.good, #log p.new.bad, #log p.new.story { animation: logslide .5s ease-out, logglow 1.6s; }
  @keyframes logslide { from { opacity: 0; translate: -12px 0; } }
  @keyframes logglow { from { background: color-mix(in srgb, var(--accent) 20%, transparent); } }
  #view.dawn { animation: dawn .9s ease-out; }
  @keyframes dawn { 0% { filter: brightness(.4) sepia(.6); } 100% { filter: none; } }

  .room.reveal { animation: reveal .45s backwards cubic-bezier(.3, 1.6, .5, 1); animation-delay: var(--d, 0ms); }
  @keyframes reveal { from { opacity: 0; scale: .3; } }
  .room.here { animation: torch 1.4s infinite; }
  @keyframes torch { 0%, 100% { box-shadow: 0 0 0 2px var(--accent) inset, 0 0 12px color-mix(in srgb, var(--accent) 40%, transparent); } 30% { box-shadow: 0 0 0 2px var(--accent) inset, 0 0 20px color-mix(in srgb, var(--accent) 55%, transparent); }
    60% { box-shadow: 0 0 0 2px var(--accent) inset, 0 0 8px color-mix(in srgb, var(--accent) 27%, transparent); } }

  #fight:not([hidden]) { animation: fade .25s; }
  .fightbox { animation: boxin .35s cubic-bezier(.2, 1.4, .5, 1); transition: border-color .4s, box-shadow .4s, filter .8s; }
  .foe { animation: foein .45s backwards cubic-bezier(.2, 1.5, .5, 1); animation-delay: calc(var(--i) * 90ms + 150ms); }
  .foe .ico { display: inline-block; animation: bob 1.8s ease-in-out infinite; animation-delay: calc(var(--i) * -.45s); }
  .foe.boss { animation: foein .6s backwards, aura 1.8s ease-in-out infinite; }
  .foe.boss .ico { font-size: 2.2rem; }
  .foe .ico, .hero .face { transition: filter .5s, rotate .5s, scale .5s; }
  .foe.dead .ico { animation: none; filter: grayscale(1); rotate: -80deg; scale: .7; }
  .hero.dead .face { filter: var(--face-filter) grayscale(1); }
  .fightbox.victory { border-color: #ffd23a; box-shadow: 0 0 30px #ffd23a55; }
  .fightbox.defeat { border-color: var(--bad); filter: saturate(.3); }
  @keyframes fade { from { opacity: 0; } }
  @keyframes boxin { from { opacity: 0; scale: .85; translate: 0 30px; } }
  @keyframes foein { from { opacity: 0; translate: 0 -40px; scale: .6; } }
  @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -4px; } }
  @keyframes aura { 0%, 100% { box-shadow: 0 0 6px #c9655a66; border-color: color-mix(in srgb, var(--bad) 50%, var(--card)); } 50% { box-shadow: 0 0 22px #ff5a3aaa; border-color: var(--bad); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
    .veil { display: none; }
  }
  .themes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0 0 .9em; }
  .themes button { padding: 0; overflow: hidden; border-radius: 10px; border: 1px solid var(--line); display: flex; flex-direction: column; }
  .themes button.on { box-shadow: 0 0 0 2px var(--accent); border-color: var(--accent); }
  .themes .sw { display: flex; align-items: center; gap: 3px; padding: .55em .45em; }
  .themes .sw i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .themes .sw i:first-child { width: 14px; height: 14px; }
  .themes small { display: block; padding: .3em .2em .4em; font-size: .62rem; line-height: 1.15; }
  .stats { display: flex; flex-wrap: wrap; justify-content: center; gap: .9em; margin: .2em 0; }
  .stats span { display: inline-flex; align-items: center; gap: .3em; }
  .card.person { align-items: center; gap: 12px; padding-top: .6em; padding-bottom: .6em; }
  .person .face { width: 56px; height: 56px; }
  .person .grow { display: flex; flex-direction: column; gap: 5px; }
  .person .bar, .person .row { margin: 0; }
  .person .stats { gap: .7em; margin: 0; font-size: .85rem; }
  .person .feel { display: inline-flex; align-items: center; gap: .45em; font-size: .85rem; }
  .person .feel span { display: inline-flex; align-items: center; gap: .25em; }
  .arrival .hpline { width: 60%; }
  .row.center { justify-content: center; }
  .thoughts { display: flex; flex-wrap: wrap; gap: 4px; margin: .35em 0; }
  .thought { display: inline-flex; align-items: center; gap: .3em; font-size: .8rem; padding: .1em .5em;
    border: 1px solid var(--line); border-radius: 999px; }
  .thought.good { border-color: color-mix(in srgb, var(--good) 50%, var(--line)); color: var(--good); }
  .thought.bad { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); color: var(--bad); }
  #log { cursor: pointer; }
  .fulllog { font-size: .85rem; } .fulllog p { margin: .3em 0; } .fulllog p.day, .fulllog small { color: var(--dim); }
  .fulllog small { margin-right: .3em; }
  [data-hold] { touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .card.person { cursor: pointer; }
  .remembered { display: flex; flex-wrap: wrap; gap: 6px; }
  .remembered button { display: inline-flex; align-items: center; gap: .4em; padding: .2em .6em .2em .2em; border-radius: 999px; }
  .remembered img, .arrival.gone .face { filter: var(--face-filter) grayscale(1); }
  .lifelog { border-top: 1px solid var(--line); margin-top: .8em; padding-top: .4em; font-size: .85rem; }
  .lifelog p { margin: .3em 0; } .lifelog small { color: var(--dim); margin-right: .3em; }
  .lifelog p.felt { font-style: italic; }
